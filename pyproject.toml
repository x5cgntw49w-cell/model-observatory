[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-observatory"
version = "0.1.0"
description = "Dependency-light classification evaluation, calibration, slice analysis, and drift reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luqman Arshad" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
model-observatory = "model_observatory.cli:main"

[tool.setuptools.packages.find]
include = ["model_observatory*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
